<form method="post">
    {% csrf_token %}

    {{ formset.management_form }}


    <table>
        <tr>
            <th>Assignment Name</th>
            <th>Assignment Weight</th>
        </tr>

        {% for form in formset %}
        <tr>
            <td>{{ form.assignment_name }}</td>
            <td>{{ form.assignment_weight }}</td>
        </tr>
        {% endfor %}
    </table>

    <button type="submit">Save All</button>
    {{ formset.non_form_errors }}
</form>
