<h2>Upload File</h2>

<form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Upload</button>
</form>

<hr>

<h2>Uploaded Files</h2>

{% for file in files %}
    <p>{{ file.title }}</p>
    <a href="{{ file.file.url }}">Download</a>
{% empty %}
    <p>No files uploaded yet.</p>
{% endfor %}
